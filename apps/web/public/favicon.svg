<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The sidebar mark. A favicon cannot read CSS variables, so these repeat the --primary
       and --primary-foreground values from src/index.css, light and dark. -->
  <style>
    .tile { fill: #10656b; }
    .bars { stroke: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #3fb8b2; }
      .bars { stroke: #11161b; }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="6" />
  <path class="bars" d="M11 22v-6M16 22V10M21 22v-9" stroke-width="3" stroke-linecap="round" fill="none" />
</svg>
