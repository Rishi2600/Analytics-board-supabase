name: CI

on:
  push:
    branches: [main]
  pull_request:

# A later push to the same branch cancels an in-flight run rather than queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # The dashboard bundle is public. This is the automated half of the definition of
      # done item that says no service role key reaches the browser.
      - name: Check the bundle for secret material
        run: ./scripts/check-bundle-secrets.sh apps/web/dist
